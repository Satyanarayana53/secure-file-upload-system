# Production Docker Compose Architecture for Secure File Upload System
# Self-contained, isolated internal network, non-root processes, health-checked services
services:
  # 1. Antivirus Engine (ClamAV Daemon)
  clamav:
    image: clamav/clamav:stable
    container_name: secure_upload_clamav
    restart: unless-stopped
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "1.5"
    networks:
      - internal_secure_network
    # Notice: port 3310 is NOT exposed to the host/internet; only reachable on internal_secure_network

  # 2. Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secure_upload_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000" # Expose to local host or reverse proxy only
    environment:
      - NODE_ENV=production
      - PORT=5000
      - TRUST_PROXY=1
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CLAMAV_ENABLED=true
    env_file:
      - ./backend/.env
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - internal_secure_network

  # 3. React Production Frontend (Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secure_upload_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal_secure_network

networks:
  internal_secure_network:
    driver: bridge

volumes:
  clamav_signatures:
    driver: local
